<svg xmlns="http://www.w3.org/2000/svg" width="760" height="152" viewBox="0 0 760 152" role="img"><title>Create. Learn. Repeat. — animated terminal</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171D35"/><stop offset="1" stop-color="#272549"/></linearGradient></defs><rect x="1" y="1" width="758" height="150" rx="20" fill="url(#bg)" stroke="#615C94"/><style>@keyframes type{0%,8%{width:0}55%,88%{width:640px}100%{width:0}}@keyframes blink{50%{opacity:0}}.reveal{animation:type 12s steps(38,end) infinite}.cursor{animation:blink 1s step-end infinite}@media(prefers-reduced-motion:reduce){.reveal{animation:none;width:640px}.cursor{animation:none}}</style><defs><clipPath id="typing"><rect class="reveal" x="58" y="61" width="640" height="45"/></clipPath></defs><circle cx="28" cy="25" r="4" fill="#B9A3FF"/><circle cx="45" cy="25" r="4" fill="#90D5E8"/><circle cx="62" cy="25" r="4" fill="#BBC1D8"/><text x="88" y="30" fill="#BBC1D8" font-family="Segoe UI,Arial,sans-serif" font-size="12" >alphonso / midnight workspace</text><text x="28" y="91" fill="#90D5E8" font-family="Segoe UI,Arial,sans-serif" font-size="22" >&gt;</text><g clip-path="url(#typing)"><text x="58" y="91" fill="#B9A3FF" font-family="Segoe UI,Arial,sans-serif" font-size="27" letter-spacing="2">Create. Learn. Repeat.</text></g><text x="407" y="91" fill="#90D5E8" font-family="Segoe UI,Arial,sans-serif" font-size="26" class="cursor">_</text><text x="28" y="126" fill="#BBC1D8" font-family="Segoe UI,Arial,sans-serif" font-size="15" >Somewhere between data and daydreams.</text></svg>
